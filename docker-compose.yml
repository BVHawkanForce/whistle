services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/whistleblowing
      - NODE_ENV=development
      - ENCRYPTION_KEY=a-very-secret-key-that-you-should-change

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whistleblowing
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
